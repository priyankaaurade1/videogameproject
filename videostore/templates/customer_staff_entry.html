{% extends 'base.html' %}
{% load static %}
{% block page_title %}Customer entires{% endblock %}
{% block content %}

  <style>
    .container-box {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    .form-wrapper {
      flex: 0 0 60%;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
    }
    .preview-wrapper {
      flex: 0 0 38%;
      background: #fff8e1;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 8px rgba(0,0,0,0.05);
      min-height: 400px;
    }
    .readonly-field[readonly] {
      background-color: #f8f9fa; 
      color: #6c757d;           
      font-weight: 500;
      cursor: not-allowed;
    }

    @media (max-width: 992px) {
      .form-wrapper, .preview-wrapper {
        flex: 100%;
      }
    }
  </style>
  <style>
    /* Mobile: make data-entry fields 2 columns */
@media (max-width: 575.98px) {

    .form-wrapper {
        padding: 12px;
    }

    .form-wrapper .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        column-gap: 10px;
        margin-left: 0;
        margin-right: 0;
    }

    .form-wrapper .row > [class*="col-"] {
        width: 100%;
        padding-left: 0;
        padding-right: 0;
    }

    .form-label {
        font-size: 12px;
        margin-bottom: 4px;
    }

    .form-control,
    .form-select {
        font-size: 13px;
        padding: 7px 8px;
        min-height: 38px;
    }
}
@media (max-width: 992px) {
    .form-wrapper, .preview-wrapper {
        flex: 100%;
    }
}

/* Mobile: make data-entry fields 2 columns */
@media (max-width: 575.98px) {

    .form-wrapper {
        padding: 12px;
    }

    .form-wrapper .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        column-gap: 10px;
        margin-left: 0;
        margin-right: 0;
    }

    .form-wrapper .row > [class*="col-"] {
        width: 100%;
        padding-left: 0;
        padding-right: 0;
    }

    .form-label {
        font-size: 12px;
        margin-bottom: 4px;
    }

    .form-control,
    .form-select {
        font-size: 13px;
        padding: 7px 8px;
        min-height: 38px;
    }
}
  </style>
<div class="container container-box">
<div id="statusMessage" style="display:none; font-weight:bold;"></div>
  <!-- Left Form -->
  <div class="form-wrapper">
    <!-- <h3 class="text-center mb-3">🎮 Game Store - Customer Entry</h3> -->
    <div class="text-center mb-4">
      <strong>🧾 Bill No:</strong> {{ bill_no }}
    </div>
    <form method="POST" id="entryForm" enctype="multipart/form-data">
      {% csrf_token %}
      <input type="hidden" name="entry_id" id="entry_id">
      <div class="row">
        <div class="col-md-3 mb-3">
          <label class="form-label">Staff ID</label>
          <input type="text" class="form-control readonly-field" 
                value="{% if request.user.store %}{{ request.user.username }} - {{ request.user.store.name }}{% else %}{{ request.user.username }}{% endif %}" 
                readonly>
        </div>
        <div class="col-md-3 mb-3">
          <label class="form-label">Customer ID</label>
          <input type="text" class="form-control readonly-field" name="customer_id" value="{{ customer_id }}" readonly>
        </div>
        <div class="col-md-3 mb-3">
          <label class="form-label">Date</label>
          <input type="text" class="form-control readonly-field" value="{{ now|date:'Y-m-d' }}" readonly>
        </div>
        <div class="col-md-3 mb-3">
          <label class="form-label">Time</label>
          <input type="text" class="form-control readonly-field" value="{{ now|time:'H:i:s' }}" readonly>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Select Machine</label>
          <select class="form-select" name="machine" id="machine" 
                  {% if staff_machine %} disabled {% endif %}
                  required>
            {% if staff_machine %}
              <option value="{{ staff_machine.id }}" selected>
                {{ staff_machine.name }} - {{ staff_machine.number }}
              </option>
            {% else %}
              <option value="">Select Machine</option>
              {% for machine in machines %}
                <option value="{{ machine.id }}">{{ machine.name }} - {{ machine.number }}</option>
              {% endfor %}
            {% endif %}
          </select>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Customer Name</label>
          <input type="text" class="form-control" name="customer_name" placeholder="Enter customer name" required>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">In Points</label>
            <input type="number" class="form-control"
                  name="in_points"
                  min="0" placeholder="Enter in points"
                  required>
        </div>

        <div class="col-md-6 mb-3">
            <label class="form-label">Out Points</label>
            <input type="number" class="form-control"
                  name="out_points"
                  min="0" placeholder="Enter out points"
                  required>
        </div>

        <div class="col-md-6 mb-3">
            <label class="form-label">Expense Type</label>
            <select class="form-select"
                    name="expense_type"
                    id="expense_type"
                    required>
                <option value="">Select Expense</option>
                <option value="salary">Salary</option>
                <option value="tea">Tea</option>
                <option value="water">Water</option>
                <option value="lightbill">Light Bill</option>
                <option value="police">Police</option>
                <option value="goodluck">Good Luck</option>
                <option value="other">Other</option>
            </select>
        </div>

        <div class="col-md-6 mb-3">
            <label class="form-label">Expense Amount</label>
            <input type="number"
                  class="form-control"
                  name="expense_amt"
                  id="expense_amt"
                  min="0" placeholder="Enter expense amt"
                  required>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Good Luck</label>
            <input type="number" class="form-control"
                  name="goodluck_amt"
                  id="goodluck_amt"
                  min="0" placeholder="Enter goodluck amt">
        </div>
        <div class="col-md-6 mb-3" id="remarks_group" style="display: none;">
          <label class="form-label">Remarks</label>
          <textarea class="form-control" name="remarks" id="remarks" rows="3" placeholder="Enter expense remark"></textarea>
        </div>
      </div>
      <!-- <div class="mb-3">
        <label class="form-label">Take Photo (Camera)</label>
        <div>
          <video id="camera" width="100%" autoplay playsinline style="border: 1px solid #ccc; border-radius: 5px;"></video>
          <canvas id="snapshot" style="display: none;"></canvas>
          <input type="hidden" name="photo_data" id="photo_data">
          <button type="button" class="btn btn-outline-primary mt-2" onclick="takeSnapshot()">📸 Take Snapshot</button>
        </div>
      </div> -->
      <div class="text-center">
        <button type="submit" id="saveBtn" class="btn btn-primary px-4">💾 Save Data</button>
        <!-- <button type="button" id="enableEditBtn" class="btn btn-warning px-4" style="display: none;">✏️ Edit</button> -->
      </div>
    </form>
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const form = document.getElementById('entryForm');
  const printBtn = document.getElementById('printBtn');
  const saveBtn = document.getElementById('saveBtn');
  const enableEditBtn = document.getElementById('enableEditBtn');
  const msgBox = document.getElementById('statusMessage');

  if (!form) return;

    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      if (!confirm("Are you sure you want to save this data?")) return;

      const formData = new FormData(form);

      try {
          const response = await fetch('', {
              method: 'POST',
              headers: {
                  'X-Requested-With': 'XMLHttpRequest'
              },
              body: formData
          });

          if (!response.ok) {
              throw new Error(`HTTP ${response.status}`);
          }

          const result = await response.json();

          if (result.success) {

              msgBox.innerText = "✅ Data saved successfully!";
              msgBox.style.color = "green";
              msgBox.style.display = "block";

              // Wait a moment so user can see success message,
              // then reload a completely fresh entry form.
              setTimeout(() => {
                  window.location.href = window.location.pathname;
              }, 1000);

          } else {
              throw new Error("Server returned success=false");
          }

      } catch (err) {
          console.error("Save error:", err);
          alert("❌ Failed to save data.");
      }
  });
});

</script>
{% endblock %}
